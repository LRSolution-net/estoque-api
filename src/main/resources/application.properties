spring.application.name=estoque-api

# Define o profile ativo por padrão (Critério de Pronto)
spring.profiles.active=dev

# Flyway: Ativa a migração automática
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true

# Configurações do Hibernate/JPA (Opcional, mas comum)
spring.datasource.url=jdbc:postgresql://${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_SENHA}
spring.datasource.driver-class-name=org.postgresql.Driver


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

##Usuario
app.admin.username=admin_dev
app.admin.password=admin123